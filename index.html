<!DOCTYPE html>
<html>
<head>
  <title>Weather App</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    background: #eaf3fb;
    max-width: 420px;
    margin: 40px auto;
    padding: 0 16px;
    text-align: center;
  }
  input {
    padding: 10px;
    width: 60%;
    border: 1px solid #f10a0a;
    border-radius: 6px;
    font-size: 16px;
  }
  #searchBtn {
    padding: 10px 16px;
    background: #1e27a7;
    color: rgb(13, 238, 238);
    border: 0;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }
  #result {
    background: rgb(225, 223, 229);
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <h1>Weather App</h1>
  <input id="city" type="text" placeholder="Enter city">
  <button id="searchBtn">Search</button>
  <div id="result"></div>
  <script>
  const cityInput = document.getElementById("city");
  const result = document.getElementById("result");

  document.getElementById("searchBtn").onclick = async function () {
    const city = cityInput.value.trim();
    if (city === "") return;

    result.textContent = "Loading...";

    try {
      const geoUrl =
        "https://geocoding-api.open-meteo.com/v1/search?name=" +
        encodeURIComponent(city) + "&count=1";
      const geoRes = await fetch(geoUrl);
      const geoData = await geoRes.json();

      if (!geoData.results) {
        result.textContent = "City not found. Check the spelling.";
        return;
      }

      const place = geoData.results[0];

      const weatherUrl =
        "https://api.open-meteo.com/v1/forecast?latitude=" + place.latitude +
        "&longitude=" + place.longitude + "&current_weather=true";
      const weatherRes = await fetch(weatherUrl);
      const weatherData = await weatherRes.json();
      const w = weatherData.current_weather;

      result.innerHTML =
        "<h2>" + place.name + ", " + place.country + "</h2>" +
        "<p>Temperature: " + w.temperature + " °C</p>" +
        "<p>Wind speed: " + w.windspeed + " km/h</p>";
    } catch (error) {
      result.textContent = "Something went wrong. Check your internet.";
    }
  };
  </script>
</body>
</html>
